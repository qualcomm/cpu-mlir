name: Checkin CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      pr_branch:
        required: true
        type: string
      compiler:
        required: true
        type: string

jobs:
  build-test:

    runs-on: [ self-hosted ]

    permissions:
      contents: write
      statuses: write

    steps:

      - name: Hard clean workspace
        if: true
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning workspace: $GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE"/*
          rm -rf "$GITHUB_WORKSPACE"/.git || true

      - name: Checkout repo
        if: true
        uses: actions/checkout@v4
        with:
          path: cpu-mlir
          clean: true
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.pr_branch }}

      - name: Init submodules and apply patches
        if: true
        working-directory: ${{ github.workspace }}/cpu-mlir
        run: |
          set -ex
          git submodule update --init --recursive
          cd triton
          git checkout $(cat ../triton-shared/triton-hash.txt)
          git apply < ../patches/Triton-Add-ARM64-Backend.patch
          git apply < ../patches/triton_host_build.patch
          cd -
          cd triton-shared
          git apply < ../patches/triton_shared_host_build.patch
          cd -

      - name: Create venv and install requirements
        if: true
        working-directory: ${{ github.workspace }}/cpu-mlir
        run: |
          set -ex
          rm -rf .venv
          ./scripts/setup_venv_and_python_reqs.sh
          source .venv/bin/activate

      - name: Set up host LLVM and build target LLVM
        if: true
        id: compilers
        working-directory: ${{ github.workspace }}/cpu-mlir
        env:
          TOOLS_DIR: ${{ github.workspace }}/cpu-mlir/build_tools
          # Large artifacts are kept outside the workspace so "Hard clean workspace" does not delete them
          LLVM_HOST_DIR: /local/mnt/workspace/llvm_host
          LLVM_CACHE_DIR: /local/mnt/workspace/llvm_target_cache
        run: |
          set -ex
          source .venv/bin/activate

          # Host LLVM (builds Triton, Triton-Shared and the backend); downloaded only if not already present
          HOST_LLVM=$LLVM_HOST_DIR/LLVM-22.1.8-Linux-X64
          if [ ! -x "$HOST_LLVM/bin/clang" ]; then
            mkdir -p $LLVM_HOST_DIR && cd $LLVM_HOST_DIR
            wget -nv https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz
            tar -xJf LLVM-22.1.8-Linux-X64.tar.xz
            rm -f LLVM-22.1.8-Linux-X64.tar.xz
            cd -
          fi

          # Arm GNU cross toolchain (sysroot used by the backend, and by build-llvm.sh for the c++ libs)
          mkdir -p $TOOLS_DIR/gcc_host && cd $TOOLS_DIR/gcc_host
          wget -nv https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/15.3.rel1/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xJf arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          rm -f arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          cd -
          GCC_TOOLCHAIN=$TOOLS_DIR/gcc_host/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu
          ls $GCC_TOOLCHAIN/aarch64-none-linux-gnu/libc

          # Target LLVM at the commit pinned by Triton (cpu-mlir -> triton-shared -> triton -> llvm); cached per hash
          LLVM_HASH=$(grep llvm_hash triton/cmake/llvm-info.json | sed 's/.*: //' | tr -d '",')
          INSTALL_DIR=$LLVM_CACHE_DIR/$LLVM_HASH/install
          if [ ! -x "$INSTALL_DIR/bin/clang" ]; then
            # build-llvm.sh builds the aarch64 compiler-rt / c++ libs against /usr/aarch64-linux-gnu
            test -d /usr/aarch64-linux-gnu || { echo "::error::/usr/aarch64-linux-gnu missing (apt install crossbuild-essential-arm64)"; exit 1; }
            BUILD_ROOT=$LLVM_CACHE_DIR/$LLVM_HASH
            rm -rf "$BUILD_ROOT"
            mkdir -p $BUILD_ROOT && cd $BUILD_ROOT
            git clone https://github.com/llvm/llvm-project.git src
            git -C src checkout $LLVM_HASH
            ${{ github.workspace }}/cpu-mlir/scripts/build-llvm.sh $HOST_LLVM $BUILD_ROOT/src $BUILD_ROOT/build $INSTALL_DIR $GCC_TOOLCHAIN
            rm -rf $BUILD_ROOT/build
            cd -
          else
            echo "Using cached target LLVM at $INSTALL_DIR"
          fi

          # Sanity-check the aarch64 runtime libs the backend links against
          ls $INSTALL_DIR/lib/clang/*/lib/aarch64-linux-gnu/ | head
          ls $INSTALL_DIR/aarch64-linux-gnu/lib/ | head

          echo "HOST_LLVM=$HOST_LLVM" >> $GITHUB_ENV
          echo "TARGET_LLVM=$INSTALL_DIR" >> $GITHUB_ENV

      - name: Build Triton with ARM64 backend
        if: true
        id: build
        working-directory: ${{ github.workspace }}/cpu-mlir
        run: |
          set -ex
          source .venv/bin/activate
          ./scripts/build.sh $HOST_LLVM $TARGET_LLVM

      - name: ARM64 backend LIT tests
        if: true
        working-directory: ${{ github.workspace }}/cpu-mlir
        run: |
          set -ex
          source .venv/bin/activate
          TRITON_BUILD=$(ls -d triton/build/cmake.linux-x86_64-cpython-* | head -1)
          lit $TRITON_BUILD/third_party/qcom_arm64_backend/test

      - name: Build QEMU
        if: true
        working-directory: ${{ github.workspace }}/cpu-mlir
        run: |
          set -ex
          mkdir -p /tmp/triton-staging

          echo "Downloading QEMU 11.1.3"
          wget -q --show-progress https://download.qemu.org/qemu-11.1.3.tar.xz

          echo "Validating QEMU archive"
          xz -t qemu-11.1.3.tar.xz

          echo "Extracting QEMU archive"
          tar -xJf qemu-11.1.3.tar.xz
          cd qemu-11.1.3
          ./configure --target-list=aarch64-linux-user,aarch64-softmmu
          make -j"$(nproc)"

          QEMU_PATH="$PWD/build/qemu-aarch64"

          if [ ! -x "$QEMU_PATH" ]; then
            echo "::error::qemu-aarch64 was not built successfully"
            exit 1
          fi

          "$QEMU_PATH" --version

      - name: Run kernel tests on QEMU
        if: true
        working-directory: ${{ github.workspace }}/cpu-mlir/qcom_arm64_backend/python/examples
        env:
          QEMU_PATH: ${{ github.workspace }}/cpu-mlir/qemu-11.1.3/build/qemu-aarch64
          RUN_ON_SIM: 1
          TRITON_ARM64_STAGING_DIR: /tmp/triton-staging
          ARM64_TOOLCHAIN_DIR: ${{ github.workspace }}/cpu-mlir/build_tools/gcc_host/arm-gnu-toolchain-15.3.rel1-x86_64-aarch64-none-linux-gnu
          TARGET_COMPILER: ${{ env.TARGET_LLVM }}
        run: |
          set -eox pipefail
          source ${{ github.workspace }}/cpu-mlir/.venv/bin/activate
          source ${{ github.workspace }}/cpu-mlir/scripts/setup_env.sh $TARGET_COMPILER

          echo "=== Running default tests ==="
          ./run_pytest.sh -v 2>&1 | tee qemu_test_results.log

          echo "=== Running NEON tests ==="
          ./run_pytest.sh -v --target neon 2>&1 | tee qemu_test_results_neon.log

          echo "=== Running SVE tests ==="
          ./run_pytest.sh -v --target sve 2>&1 | tee qemu_test_results_sve.log

      - name: Cleanup temporary files
        if: always()
        run: |
          set -x
          echo "Cleaning temporary QEMU and test files"
          rm -rf "${{ github.workspace }}/cpu-mlir/qemu-11.1.3"
          rm -f "${{ github.workspace }}/cpu-mlir/qemu-11.1.3.tar.xz"
          rm -rf /tmp/triton-staging
          echo "Cleanup completed"
